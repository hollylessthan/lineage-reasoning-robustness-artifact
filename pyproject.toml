[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-reasoning-robustness"
version = "0.1.0"
description = "Robustness evaluation for reasoning over imperfect data-lineage graphs"
requires-python = ">=3.10"
dependencies = [
  "networkx==3.6.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

