name: Paper artifact reproduction

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install pinned experiment dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0'
          python -m pip install 'torch-geometric==2.8.0.post1'
      - name: Run unit tests
        run: python -m pytest -q
      - uses: actions/checkout@v4
        with:
          repository: xlang-ai/Spider2
          ref: cafb867313aab4e674652054198f383cf4018943
          path: inputs/Spider2
          sparse-checkout: spider2-dbt/examples
      - name: Regenerate and verify all paper evidence
        run: python scripts/reproduce_paper.py --spider-root inputs/Spider2/spider2-dbt/examples
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-reproduction
          path: results/
